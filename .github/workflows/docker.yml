# Publishes the image to Docker Hub for amd64 and arm64, after CI passed:
#
#   push to main      → :latest, plus :<version> and :<major>.<minor> the first time
#                       the version in package.json is published (later pushes of the
#                       same version only move :latest, so a version tag never changes)
#   tag v<version>    → :<version>, :<major>.<minor> and :latest (the tag must match
#                       package.json; use it to publish a version again)
#   Actions tab → Run → like a push to main (main only)
#
# Pushes that change only docs or Markdown files don't build an image.
#
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# personal access token with "Read & Write"). Another image name can be set as the
# repository variable DOCKERHUB_IMAGE (default astaldoo/tidedeck).
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Not evaluated for tags: a version tag always publishes.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# One publish per ref at a time; on main a newer push replaces a running one.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'astaldoo/tidedeck' }}

jobs:
  check:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$version' isn't MAJOR.MINOR.PATCH"; exit 1
          fi
          if [[ $REF_TYPE == tag && $REF_NAME != "v$version" ]]; then
            echo "::error::Tag $REF_NAME doesn't match package.json version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Version tags
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ $REF_TYPE == tag ]]; then
            echo "tag=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if out=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1); then
            echo "$IMAGE:$VERSION is already published: only :latest moves."
            echo "tag=false" >> "$GITHUB_OUTPUT"
          elif grep -qiE "not found|manifest unknown|does not exist" <<<"$out"; then
            echo "First image of $VERSION: tagging :$VERSION too."
            echo "tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"; echo "::error::Couldn't check Docker Hub for $IMAGE:$VERSION"; exit 1
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.release.outputs.tag }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Tidedeck
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Signed build record and package list, shown on Docker Hub.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
