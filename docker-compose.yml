services:
  tidedeck:
    image: astaldoo/tidedeck:latest
    container_name: tidedeck
    restart: unless-stopped
    ports:
      - "${PORT}:3000"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-}
    volumes:
      - ./data:/app/data