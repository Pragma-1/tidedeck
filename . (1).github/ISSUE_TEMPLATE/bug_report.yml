name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security problems** please report privately (Security → Report a vulnerability), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Image tag or commit
      placeholder: "astaldoo/tidewiki:latest (pulled 2026-11-03)"
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Firefox 140 on Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Container log
      description: "Output of `docker logs tidewiki` around the time of the problem. Remove anything private."
      render: text
